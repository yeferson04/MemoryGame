
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>🧠 Memory Game</h1>
        <p>¡Encuentra todas las parejas!</p>

        <div class="info">
            <span>Movimientos: <b id="moves">0</b></span>
            <span>Tiempo: <b id="time">0</b> s</span>
        </div>

        <div class="game-board" id="game"></div>

        <h2 id="message"></h2>

        <button onclick="restartGame()">Volver a jugar</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
